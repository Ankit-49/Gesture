<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Particle System with Hand Gestures</title>
    <link rel="stylesheet" href="gesture.css">
</head>
<body>
    <div id="container"></div>
    <video id="video" autoplay playsinline></video>
    
    <div id="info">
        <h2>🎮 Hand Gestures</h2>
        <div class="gesture-item">
            <span class="gesture-emoji">✋</span>
            <span>Open Palm: Expand particles</span>
        </div>
        <div class="gesture-item">
            <span class="gesture-emoji">👌</span>
            <span>Pinch: Change colors</span>
        </div>
        <div class="gesture-item">
            <span class="gesture-emoji">🤟</span>
            <span>Three Fingers: Switch template</span>
        </div>
        <div class="gesture-item">
            <span class="gesture-emoji">✌️</span>
            <span>Peace: Previous template</span>
        </div>
        <div class="gesture-item">
            <span class="gesture-emoji">👍</span>
            <span>Thumbs Up: Reset</span>
        </div>
    </div>

    <div id="status">Initializing...</div>
    <div id="template-display">Template: Galaxy</div>

    <div class="loading" id="loading">
        <div>Loading Hand Tracking...</div>
        <div class="spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="gesture.js"></script>
</body>
</html>
